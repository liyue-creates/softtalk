<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>软话小人</title><meta name="theme-color" content="#FFF6EE">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#FFF6EE;color:#4a3b36;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overscroll-behavior:none}
::-webkit-scrollbar{display:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1{margin:2px 0 6px;font-size:20px;text-align:center;letter-spacing:1px}
h1 small{display:block;font-size:12px;font-weight:400;color:#a08b84;letter-spacing:0}
.row{display:flex;align-items:center;gap:6px;margin:3px 0;min-height:44px}
.lab{flex:0 0 46px;font-size:13px;color:#8d7770}
.chips{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.chip{min-height:38px;padding:0 11px;border-radius:19px;background:#fff;border:2px solid #f0dcd4;font-size:14px;position:relative}
.chip::after{content:"";position:absolute;inset:-3px}
.chip.on{background:#FBE3E8;border-color:#E9899B;color:#b2485d;font-weight:600}
input.t{flex:1;min-height:42px;border-radius:21px;border:2px solid #f0dcd4;background:#fff;padding:0 14px;font:inherit;font-size:16px;outline:none;min-width:0}
input.t:focus{border-color:#E9899B}
#cpRow{display:none}
.pv{flex:1;min-height:0;margin:6px 0;background:#fff;border-radius:18px;border:2px dashed #f0dcd4;padding:10px 12px;font-size:14px;line-height:1.6;overflow:hidden;display:flex;gap:8px;align-items:center}
.pv .mini{flex:0 0 64px;height:90px}
.pv p{margin:0}
.btns{display:flex;gap:8px}
.big{flex:1;min-height:50px;border-radius:25px;font-size:17px;font-weight:700;background:#E9899B;color:#fff;box-shadow:0 3px 0 #c96a7d}
.big.alt{flex:0 0 38%;background:#fff;color:#b2485d;border:2px solid #E9899B;box-shadow:0 3px 0 #f0c3cc}
.big:active{transform:translateY(2px);box-shadow:none}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);background:rgba(74,59,54,.88);color:#fff;padding:12px 22px;border-radius:22px;font-size:16px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#linkBox{position:fixed;inset:0;background:rgba(74,59,54,.35);display:none;align-items:center;justify-content:center;z-index:40;padding:24px}
#linkBox .card{background:#FFF6EE;border-radius:20px;padding:18px;width:100%;max-width:360px;text-align:center}
#linkBox .lk{background:#fff;border:2px dashed #E9899B;border-radius:12px;padding:10px;word-break:break-all;font-size:13px;-webkit-user-select:all;user-select:all;margin:10px 0;max-height:120px;overflow:hidden}
/* receiver */
.act{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));text-align:center}
.act.on{display:flex;animation:fin .4s ease}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
.env{width:230px;height:160px;position:relative;margin:18px 0;cursor:pointer;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.env svg{width:100%;height:100%}
.hint{color:#a08b84;font-size:14px;margin-top:6px}
.say{font-size:22px;font-weight:700;margin:0}
.bubble{position:relative;background:#fff;border:2.5px solid #4a3b36;border-radius:20px;padding:12px 14px;font-size:16px;line-height:1.65;max-width:340px;text-align:left;box-shadow:3px 3px 0 #f0dcd4}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;background:#fff;border-right:2.5px solid #4a3b36;border-bottom:2.5px solid #4a3b36;transform:translateX(-50%) rotate(45deg)}
.stage{position:relative;width:220px;height:260px;margin:14px 0 4px;flex-shrink:1;min-height:150px}
.fig{width:100%;height:100%;display:block;transform-origin:50% 90%}
.fig.hit{animation:squash .35s ease}
@keyframes squash{0%{transform:scale(1)}20%{transform:scale(1.15,.82) rotate(-6deg)}45%{transform:scale(.92,1.08) rotate(5deg) translateX(6px)}70%{transform:scale(1.03,.97) rotate(-3deg) translateX(-5px)}100%{transform:none}}
.fly{position:absolute;pointer-events:none;font-weight:800;color:#b2485d;font-size:18px;white-space:nowrap;animation:up 1.1s ease-out forwards;text-shadow:0 0 4px #fff,0 0 4px #fff}
@keyframes up{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
.star{position:absolute;pointer-events:none;font-size:20px;animation:st .6s ease-out forwards}
@keyframes st{to{opacity:0;transform:translate(var(--x),var(--y)) rotate(120deg) scale(.5)}}
.cnt{font-size:15px;color:#8d7770;min-height:22px}
.tease{font-size:14px;color:#b2485d;background:#FBE3E8;border-radius:14px;padding:6px 12px;margin:6px 0;display:none}
.tease.on{display:block;animation:fin .4s}
.acts2{display:flex;gap:10px;width:100%;max-width:360px;margin-top:10px}
#a3 .q{font-size:26px;font-weight:800;margin:6px 0 4px}
.zone{position:relative;width:100%;max-width:380px;height:230px;margin-top:10px}
#yes{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transition:transform .25s;min-width:110px;min-height:50px;z-index:2}
#no{position:absolute;min-height:44px;min-width:88px;padding:0 14px;border-radius:22px;background:#fff;border:2px solid #cfc2bc;color:#8d7770;font-size:15px;transition:left .22s,top .22s;white-space:nowrap}
.coupon{display:none;width:300px;max-width:88vw;background:#fff;border-radius:18px;border:3px dashed #E9899B;padding:16px;margin-top:12px;position:relative;box-shadow:0 6px 0 #FBE3E8}
.coupon.on{display:block;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.coupon h3{margin:0 0 4px;font-size:22px;color:#b2485d}
.coupon .who{font-size:14px;color:#8d7770}
.coupon .no{position:absolute;right:12px;top:8px;font-size:11px;color:#c9b4ac}
.coupon .sig{margin-top:8px;font-size:12px;color:#a08b84}
.foot{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));font-size:12px;color:#c9b4ac;width:100%;text-align:center;left:0}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (max-height:700px){.stage{height:200px;margin:8px 0 2px}.bubble{font-size:15px;padding:9px 12px}.zone{height:190px}.pv .mini{height:72px}}
@media (prefers-reduced-motion:reduce){.env{animation:none}.act.on{animation:none}}
