<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,"><title>软话小人</title><meta name="theme-color" content="#FFF6EF">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#FFF6EF;color:#4A2E22;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overscroll-behavior:none}
::-webkit-scrollbar{display:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1{margin:2px 0 6px;font-size:20px;text-align:center;letter-spacing:1px}
h1 small{display:block;font-size:12px;font-weight:400;color:#8C6D60;letter-spacing:0}
.row{display:flex;align-items:center;gap:6px;margin:3px 0;min-height:44px}
.lab{flex:0 0 46px;font-size:13px;color:#8C6D60}
.chips{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.chip{min-height:38px;padding:0 11px;border-radius:19px;background:#fff;border:2px solid #f0dcd4;font-size:14px;position:relative}
.chip::after{content:"";position:absolute;inset:-3px}
.chip.on{background:#FDEBE6;border-color:#EE7F92;color:#E8505B;font-weight:600}
input.t{flex:1;min-height:42px;border-radius:21px;border:2px solid #f0dcd4;background:#fff;padding:0 14px;font:inherit;font-size:16px;outline:none;min-width:0}
input.t:focus{border-color:#EE7F92}
#cpRow{display:none}
.pv{flex:1;min-height:0;margin:6px 0;background:#fff;border-radius:18px;border:2px dashed #f0dcd4;padding:10px 12px;font-size:14px;line-height:1.6;overflow:hidden;display:flex;gap:8px;align-items:center}
.pv .mini{flex:0 0 64px;height:90px;display:flex;justify-content:center}
.pv p{margin:0}
.btns{display:flex;gap:8px}
.big{flex:1;min-height:50px;border-radius:25px;font-size:17px;font-weight:700;background:#EE7F92;color:#fff;box-shadow:0 3px 0 #d0657a}
.big.alt{flex:0 0 38%;background:#fff;color:#E8505B;border:2px solid #EE7F92;box-shadow:0 3px 0 #f0c3cc}
.big:active{transform:translateY(2px);box-shadow:none}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);background:rgba(74,59,54,.88);color:#fff;padding:12px 22px;border-radius:22px;font-size:16px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#linkBox{position:fixed;inset:0;background:rgba(74,59,54,.35);display:none;align-items:center;justify-content:center;z-index:40;padding:24px}
#linkBox .card{background:#FFF6EF;border-radius:20px;padding:18px;width:100%;max-width:360px;text-align:center}
#linkBox .lk{background:#fff;border:2px dashed #EE7F92;border-radius:12px;padding:10px;word-break:break-all;font-size:13px;-webkit-user-select:all;user-select:all;margin:10px 0;max-height:120px;overflow:hidden}
/* receiver */
.act{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));text-align:center}
.act.on{display:flex;animation:fin .4s ease}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
.env{width:230px;height:160px;position:relative;margin:18px 0;cursor:pointer;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.env svg{width:100%;height:100%}
.hint{color:#8C6D60;font-size:14px;margin-top:6px}
.say{font-size:22px;font-weight:700;margin:0}
.bubble{max-height:34vh;overflow:hidden;position:relative;background:#fff;border:2.5px solid #4A2E22;border-radius:20px;padding:12px 14px;font-size:16px;line-height:1.65;max-width:340px;text-align:left;box-shadow:3px 3px 0 #f0dcd4}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;background:#fff;border-right:2.5px solid #4A2E22;border-bottom:2.5px solid #4A2E22;transform:translateX(-50%) rotate(45deg)}
.stage{--h:250px;position:relative;width:300px;max-width:92vw;height:var(--h);margin:14px 0 4px;flex-shrink:1;min-height:150px}
.fig{height:100%;width:auto;display:block;transform-origin:50% 95%;-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
.duo{display:flex;align-items:flex-end;justify-content:center;gap:0}.duo .me{height:var(--h);position:relative;flex:0 0 auto}.duo .me .fig{height:var(--h)}.duo>.fig.ot{height:calc(var(--h)*.78);flex:0 0 auto}
.fig.shake{animation:shk .18s linear}@keyframes shk{25%{transform:translateX(-5px) rotate(-3deg)}75%{transform:translateX(5px) rotate(3deg)}}
.fig.hit{animation:squash .35s ease}
@keyframes squash{0%{transform:scale(1)}20%{transform:scale(1.15,.82) rotate(-6deg)}45%{transform:scale(.92,1.08) rotate(5deg) translateX(6px)}70%{transform:scale(1.03,.97) rotate(-3deg) translateX(-5px)}100%{transform:none}}
.fly{position:absolute;pointer-events:none;font-weight:800;color:#E8505B;font-size:18px;white-space:nowrap;animation:up 1.1s ease-out forwards;text-shadow:0 0 4px #fff,0 0 4px #fff}
@keyframes up{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
.star{position:absolute;pointer-events:none;font-size:20px;animation:st .6s ease-out forwards}
@keyframes st{to{opacity:0;transform:translate(var(--x),var(--y)) rotate(120deg) scale(.5)}}
.cnt{font-size:15px;color:#8C6D60;min-height:22px}
.tease{font-size:14px;color:#E8505B;background:#FDEBE6;border-radius:14px;padding:6px 12px;margin:6px 0;display:none}
.tease.on{display:block;animation:fin .4s}
.acts2{display:flex;gap:10px;width:100%;max-width:360px;margin-top:10px}
#a3 .q{font-size:26px;font-weight:800;margin:6px 0 4px}
.zone{position:relative;width:100%;max-width:380px;height:230px;margin-top:10px}
#yes{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transition:transform .25s;min-width:110px;min-height:50px;z-index:2}
#no{position:absolute;min-height:44px;min-width:88px;padding:0 14px;border-radius:22px;background:#DCE8F6;border:2px solid #b9cde6;color:#4A6E99;font-size:15px;transition:left .22s,top .22s;white-space:nowrap}
.coupon{display:none;width:300px;max-width:88vw;background:#FFF1C9;border-radius:18px;border:3px dashed #E8505B;padding:16px;margin-top:10px;position:relative;box-shadow:0 6px 0 #f3dca0}
.coupon.on{display:block;margin-top:4px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.coupon h3{margin:0 0 4px;font-size:22px;color:#E8505B}
.coupon .who{font-size:14px;color:#8C6D60}
.coupon .no{position:absolute;right:12px;top:8px;font-size:11px;color:#c9b4ac}
.coupon .sig{margin-top:8px;font-size:12px;color:#8C6D60}
.foot{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));font-size:12px;color:#c9b4ac;width:100%;text-align:center;left:0}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (max-height:700px){.stage{--h:190px;margin:8px 0 2px}.bubble{max-height:34vh;overflow:hidden;font-size:15px;padding:9px 12px}.zone{height:190px}.pv .mini{height:72px}}

/* phase1 menu */
#a2{justify-content:flex-start;gap:0}
#a2 .bubble{font-size:14px;line-height:1.55;padding:9px 12px;max-height:22vh}
#a2 .stage{--h:150px;margin:12px 0 2px;min-height:110px}
.ttl{font-size:20px;font-weight:800;margin:4px 0 6px}
.bar{width:100%;max-width:360px;display:flex;align-items:center;gap:8px;font-size:13px;color:#8C6D60}
.bar .tr{flex:1;height:14px;border-radius:7px;background:#FDEBE6;border:2px solid #f0dcd4;overflow:hidden}
.bar .fl{height:100%;width:0;background:linear-gradient(90deg,#F7A7A6,#EE7F92);border-radius:7px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:360px;margin-top:8px}
.cd{position:relative;background:#fff;border:2px solid #f0dcd4;border-radius:16px;min-height:64px;padding:6px 4px;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 #f0dcd4}
.cd i{font-style:normal;font-size:22px}
.cd small{font-weight:400;font-size:11px;color:#8C6D60}
.cd.main{grid-column:1/-1;flex-direction:row;gap:10px;min-height:62px;font-size:18px;background:#FDEBE6;border-color:#EE7F92;color:#E8505B;box-shadow:0 3px 0 #f0c3cc}
.cd.main i{font-size:28px}
.cd:active{transform:translateY(2px);box-shadow:none}
.cd.done::after{content:"✓";position:absolute;right:6px;top:4px;width:20px;height:20px;border-radius:10px;background:#EE7F92;color:#fff;font-size:13px;line-height:20px}
#fgo{display:none;width:100%;max-width:360px;margin-top:10px;flex:0 0 auto}
#fgo.on{display:block;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.ov{position:fixed;inset:0;z-index:20;background:#FFF6EF;display:none;flex-direction:column;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 18px max(14px,env(safe-area-inset-bottom));text-align:center}
.ov.on{display:flex;animation:fin .3s ease}
.ov .x{position:absolute;right:12px;top:max(10px,env(safe-area-inset-top));width:44px;height:44px;border-radius:22px;background:#fff;border:2px solid #f0dcd4;font-size:20px;color:#8C6D60}
.ov h2{margin:0 0 8px;font-size:21px}
.ov .big{flex:0 0 auto;width:100%;max-width:340px;margin-top:10px}
#ovHit .stage{--h:300px;margin:10px 0}
.catch{position:absolute;inset:0;z-index:3;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.nosel{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pens{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:360px}
.pens .chip{font-size:15px}
#penIn{display:none;width:100%;max-width:340px;margin-top:8px;flex:0 0 auto}
#tk{display:none;width:auto;max-width:100%;max-height:calc(100vh - 190px);border-radius:12px;box-shadow:0 6px 18px rgba(74,46,34,.18);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.ph{font-size:16px;line-height:1.7;background:#fff;border:2px dashed #f0dcd4;border-radius:16px;padding:14px;max-width:340px}
@media (max-height:700px){#a2 .stage{--h:118px;margin:10px 0 0;min-height:90px}#ovHit .stage{--h:240px}.cd{min-height:56px}.cd.main{min-height:52px}.ttl{font-size:18px;margin:2px 0 4px}}

#app.gen{overflow-y:auto;-webkit-overflow-scrolling:touch}
#app.gen .pv{flex:0 0 auto;min-height:96px}
#app.gen .chip{min-height:34px;padding:0 10px;font-size:13.5px}
#app.gen .row{min-height:40px;margin:2px 0}
.cd .tag{position:absolute;left:6px;top:4px;font-size:10px;font-style:normal;background:#E8505B;color:#fff;border-radius:8px;padding:1px 6px;font-weight:700}
.wh{position:relative;width:260px;height:260px;margin:6px 0}
.wh .disc{width:100%;height:100%;border-radius:50%;border:6px solid #4A2E22;transition:transform 3s cubic-bezier(.15,.85,.25,1);position:relative;overflow:hidden;box-shadow:0 5px 0 #f0dcd4}
.wh .lb{position:absolute;left:50%;top:50%;width:50%;height:28px;margin-top:-14px;transform-origin:0 50%;text-align:right;padding-right:10px;font-size:13.5px;font-weight:700;color:#4A2E22;line-height:28px;white-space:nowrap}
.wh .pin{position:absolute;left:50%;top:-8px;margin-left:-13px;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid #E8505B;z-index:2;filter:drop-shadow(0 2px 0 #fff)}
.wh .hub{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#fff;border:4px solid #4A2E22;z-index:2}
#whRes{min-height:28px;font-size:18px;font-weight:800;color:#E8505B}
.letter{background:#fff;border-radius:6px 6px 18px 18px;padding:22px 20px 18px;max-width:330px;text-align:left;font-size:16px;line-height:1.9;color:#4A2E22;box-shadow:0 6px 16px rgba(74,46,34,.12);background-image:repeating-linear-gradient(transparent 0 29px,#f6e3da 29px 30px);background-position:0 16px;position:relative}
.letter .to{color:#E8505B;font-weight:700;margin-bottom:4px}.letter .fr{text-align:right;color:#8C6D60;margin-top:8px}
#calmL{display:none;margin-top:8px;font-size:14px;color:#8C6D60;text-decoration:underline;padding:8px}
#a3 .imgbox{display:none;flex-direction:column;align-items:center}
#a3 .imgbox.on{display:flex;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
#a3 .imgbox img{max-width:100%;max-height:calc(100vh - 150px);border-radius:12px;box-shadow:0 6px 18px rgba(74,46,34,.18)}
#ovCalm img{display:block;max-width:100%;max-height:calc(100vh - 230px);border-radius:12px;box-shadow:0 6px 18px rgba(74,46,34,.18)}
@media (max-height:700px){#a3 .q{font-size:22px;margin:2px 0}#stg3{--h:140px!important;margin:4px 0!important}.zone{height:200px}.wh{width:220px;height:220px}}
@media (prefers-reduced-motion:reduce){.env{animation:none}.act.on{animation:none}}
</style></head><body><div id="app"></div><div id="toast"></div>
<div id="linkBox"><div class="card"><b>长按下面的链接复制</b><div class="lk" id="lk"></div><div class="hint">复制好就去发给 TA 吧</div><div class="btns" style="margin-top:10px"><button class="big" id="lkOk">好的</button></div></div></div>
